# Phase 0 proof-of-concept only (docs/dkb-secret-build-plan.md §8, Phase 0).
# Deliberately ad-hoc signed and sandboxed with NO network entitlement — the
# point is to confirm the Secure Enclave + HPKE + login-Keychain design works
# under exactly the constraints the real app will ship with. Deleted after
# Phase 0; results are recorded in the plan.
name: DKBSecretPoC
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  DEVELOPMENT_TEAM: ""
  ENABLE_HARDENED_RUNTIME: YES
targets:
  DKBSecretPoC:
    type: application
    platform: macOS
    sources:
      - DKBSecretPoC
    info:
      path: DKBSecretPoC/Info.plist
      properties:
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSUIElement: false
    entitlements:
      path: DKBSecretPoC/DKBSecretPoC.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      # Distinct from the real app's com.dangkhoabach.dkb-secret so the PoC's
      # Keychain item never collides with production data later.
      PRODUCT_BUNDLE_IDENTIFIER: com.dangkhoabach.dkb-secret.poc
      PRODUCT_NAME: "DKB Secret PoC"
